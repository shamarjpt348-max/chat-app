services:
  - type: web
    name: mitra-chat
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_EXTERNAL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
